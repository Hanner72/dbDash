<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Radar</title>
<link rel="stylesheet" href="common.css">
<style>
  #root { width: 220px; }
  #root.panel { background: rgba(12, 14, 18, calc(var(--bg-a) * .9)); border-radius: 16px; }
  canvas { display: block; width: 220px; height: 300px; }
  /* Radar leer oder Qualifikation: ausblenden (außer im Verschiebe-Modus) */
  body.radar-empty:not(.edit) #root, body.radar-off:not(.edit) #root { visibility: hidden; }
</style>
</head>
<body data-overlay="radar">
<div id="root" class="panel"><canvas id="cv" width="440" height="600"></canvas></div>
<script src="common.js"></script>
<script>
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const W = 220, H = 300, CX = W / 2, CY = H / 2;
  ctx.scale(2, 2); // scharf auf hochauflösenden Bildschirmen
  const OVERLAP = 5.5;          // m: ab hier gilt ein Auto als "neben dir"
  const CAR_W = 24, LANE = 38;  // Darstellung in Pixeln
  const MIN_LEN = 48;           // Mindestlänge eines Autos in Pixeln (bei großer Reichweite)
  let shown = false;

  // iRacing CarLeftRight: 0 aus, 1 frei, 2 links, 3 rechts, 4 links+rechts, 5 zwei links, 6 zwei rechts
  const SIDES = { 2: ['L'], 3: ['R'], 4: ['L', 'R'], 5: ['L', 'L2'], 6: ['R', 'R2'] };
  const LANE_X = { L: -1, R: 1, L2: -1.9, R2: 1.9, C: 0 };
  // Seitenspur je Auto merken: iRacing liefert keine seitliche Position, nur die Spotter-Meldung (CarLeftRight).
  // Ein Auto, das neben dir war, bleibt in seiner Spur, während es zurückfällt oder davonzieht – so sieht man,
  // auf welcher Seite es fährt. Vergessen wird die Spur erst weiter weg (FORGET) oder wenn es überlappt, der
  // Spotter diese Seite aber nicht (mehr) meldet (dann fährt es in Wahrheit direkt vor/hinter dir).
  const NEAR = 10;     // m: so weit darf ein vom Spotter gemeldetes Auto laut Streckenposition weg sein (ungenau)
  const FORGET = 25;   // m: weiter weg → zurück zur Mitte
  const laneMem = new Map(); // idx → { lane, x (angezeigt), seen (Zeit der letzten Spotter-Bestätigung) }
  let lastFrame = 0;

  // GT3 von oben als technische Zeichnung – dieselben Linien wie die Schadensgrafik im Dashboard
  // (Zeichenfläche dort: x 32–124, y 6–218)
  const BP = {
    body: new Path2D('M78,12 Q100,12 112,18 L117,26 Q121,36 122,48 L122,72 Q121,82 115,88 L112,100 L112,132 L116,140 Q123,150 124,160 L124,182 Q123,194 117,200 L114,210 Q100,216 78,216 Q56,216 42,210 L39,200 Q33,194 32,182 L32,160 Q33,150 40,140 L44,132 L44,100 L41,88 Q35,82 34,72 L34,48 Q35,36 39,26 L44,18 Q56,12 78,12 Z'),
    glass: new Path2D('M54,82 Q78,76 102,82 L98,100 Q78,96 58,100 Z M58,140 Q78,143 98,140 L102,158 Q78,162 54,158 Z'),
    lines: new Path2D('M42,17 Q78,5 114,17 M52,24 Q78,20 104,24 L106,76 Q78,80 50,76 Z M58,100 L58,140 M98,100 L98,140 M64,180 L64,192 M92,180 L92,192'),
    wing: new Path2D('M36,192 L120,192 L120,200 L36,200 Z M33,186 L37,186 L37,205 L33,205 Z M119,186 L123,186 L123,205 L119,205 Z'),
    roof: new Path2D('M71,112 L85,112 L85,126 L71,126 Z'),
  };
  function bp(path, m) { const p = new Path2D(); p.addPath(path, m); return p; }

  // color = Linienfarbe, alpha = Deckkraft (weiter entfernt = blasser), cls = Klassenfarbe (Dachluke)
  // off = Versatz der Fahrzeugmitte in Pixeln nach vorne
  // lx = seitliche Lage in Spurbreiten (0 = deine Spur, −1 links, +1 rechts)
  function drawCar(lx, off, len, color, alpha, cls) {
    const x = CX + lx * LANE - CAR_W / 2;
    const y = CY - off - len / 2;
    const m = new DOMMatrix().translate(x, y).scale(CAR_W / 92, len / 212).translate(-32, -6);
    const body = bp(BP.body, m);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineJoin = 'round';
    ctx.fillStyle = color; ctx.globalAlpha = alpha * 0.14; ctx.fill(body);
    ctx.globalAlpha = alpha * 0.22; ctx.fill(bp(BP.glass, m));
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.stroke(body);
    ctx.lineWidth = 0.8; ctx.globalAlpha = alpha * 0.85;
    ctx.stroke(bp(BP.glass, m)); ctx.stroke(bp(BP.lines, m)); ctx.stroke(bp(BP.wing, m));
    if (cls) { ctx.globalAlpha = alpha; ctx.fillStyle = cls; ctx.fill(bp(BP.roof, m)); }
    ctx.restore();
  }

  function sideGlow(left) {
    const g = ctx.createLinearGradient(left ? 0 : W, 0, left ? 46 : W - 46, 0);
    g.addColorStop(0, 'rgba(255,70,70,.75)'); g.addColorStop(1, 'rgba(255,70,70,0)');
    ctx.fillStyle = g; ctx.fillRect(left ? 0 : W - 46, 0, 46, H);
  }

  PW.onState((st, cfg) => {
    const r = st.radar;
    if (!st.connected || !r) return;
    const range = r.range || 40, view = r.view || range, carLen = r.carLen || 4.7;
    // Maßstab: Autos mindestens MIN_LEN lang; die Lücke zwischen den Autos bleibt maßstabsgetreu,
    // damit sich die Zeichnungen nur berühren, wenn sich die Autos wirklich berühren
    let scale = (H / 2 - 18) / view, len = carLen * scale;
    if (len < MIN_LEN) { len = MIN_LEN; scale = (H / 2 - 18 - len) / Math.max(1, view - carLen); }
    const pos = (c) => {
      const ad = Math.abs(c.dist);
      if (ad < carLen) return c.dist / carLen * len; // überlappend
      return Math.sign(c.dist) * (len + (c.gap != null ? c.gap : ad - carLen) * scale);
    };
    const sides = SIDES[r.side] || [];

    // In der Qualifikation kein Radar
    document.body.classList.toggle('radar-off', !!r.qualify);

    // Sofort ausblenden, sobald kein Auto innerhalb der Reichweite (Lücke) ist; kleine Toleranz beim
    // Ausblenden, damit es an der Grenze nicht flackert
    const limit = shown ? range + Math.max(0.2, range * 0.05) : range;
    const busy = sides.length > 0 || r.cars.some((c) => (c.gap != null ? c.gap : Math.abs(c.dist)) <= limit);
    const autoHide = !!(cfg && cfg.radarAutoHide !== false);
    shown = busy || !autoHide;
    document.body.classList.toggle('radar-empty', autoHide && !busy);
    if (!document.body.classList.contains('edit') && (r.qualify || (autoHide && !busy))) return; // unsichtbar → nicht zeichnen

    ctx.clearRect(0, 0, W, H);
    // Blueprint-Raster
    ctx.strokeStyle = 'rgba(61,220,132,.07)'; ctx.lineWidth = 0.6; ctx.beginPath();
    for (let gx = CX % 10; gx < W; gx += 10) { ctx.moveTo(gx, 0); ctx.lineTo(gx, H); }
    for (let gy = CY % 10; gy < H; gy += 10) { ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
    ctx.stroke();
    // Abstandslinien (beschriftet mit der Lücke zum anderen Auto)
    ctx.font = '600 9px Bahnschrift, Segoe UI, sans-serif';
    ctx.textAlign = 'left';
    const step = view <= 12 ? 2 : view <= 25 ? 5 : 10;
    for (let m = step; carLen + m <= view; m += step) {
      for (const s of [1, -1]) {
        const y = CY - s * (len / 2 + m * scale); // Linie = Stoßstange eines Autos mit dieser Lücke
        ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
        ctx.setLineDash([3, 4]); ctx.beginPath(); ctx.moveTo(14, y); ctx.lineTo(W - 14, y); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fillText(m + 'm', 6, y - 3);
      }
    }
    // Spuren
    ctx.strokeStyle = 'rgba(255,255,255,.05)';
    for (const x of [CX - LANE / 2, CX + LANE / 2]) { ctx.beginPath(); ctx.moveTo(x, 8); ctx.lineTo(x, H - 8); ctx.stroke(); }

    if (sides.some((s) => s[0] === 'L')) sideGlow(true);
    if (sides.some((s) => s[0] === 'R')) sideGlow(false);

    // Autos neben dir den Seiten zuordnen, die der Spotter meldet: zuerst Autos, die schon auf dieser Seite
    // gemerkt sind, dann die nächsten (die Streckenposition ist auf wenige Meter ungenau)
    const now = performance.now(), dt = Math.min(0.2, (now - lastFrame) / 1000); lastFrame = now;
    const cars = r.cars.slice();
    const ids = new Set(cars.map((c) => c.idx));
    for (const k of laneMem.keys()) if (!ids.has(k)) laneMem.delete(k);
    const near = cars.filter((c) => Math.abs(c.dist) < NEAR).sort((a, b) => Math.abs(a.dist) - Math.abs(b.dist));
    const confirmed = new Set();
    const sideOf = (lane) => Math.sign(LANE_X[lane]);
    for (const lane of sides) {
      const free = near.filter((c) => !confirmed.has(c));
      const m = (c) => laneMem.get(c.idx);
      const c = free.find((x) => m(x) && m(x).lane === lane) || free.find((x) => m(x) && sideOf(m(x).lane) === sideOf(lane))
        || free.find((x) => !m(x) || m(x).lane === 'C') || free[0];
      if (!c) { cars.push({ dist: 0, color: '#ff5a5a', ghostOnly: true, lane }); continue; } // gemeldet, aber nicht gefunden
      const mem = laneMem.get(c.idx) || { x: 0 };
      laneMem.set(c.idx, { ...mem, lane, seen: now });
      confirmed.add(c);
    }
    const reported = new Set(sides.map(sideOf));
    for (const c of cars) {
      if (c.ghostOnly) { c.x = LANE_X[c.lane]; continue; }
      let mem = laneMem.get(c.idx);
      if (!mem) { mem = { lane: 'C', x: 0, seen: 0 }; laneMem.set(c.idx, mem); }
      if (!confirmed.has(c) && mem.lane !== 'C') {
        const ad = Math.abs(c.dist);
        // überlappt, aber Spotter meldet diese Seite seit 0,5 s nicht → fährt direkt vor/hinter dir
        if (ad > FORGET || (ad < OVERLAP * 0.6 && !reported.has(sideOf(mem.lane)) && now - mem.seen > 500)) mem.lane = 'C';
      }
      mem.x += (LANE_X[mem.lane] - mem.x) * Math.min(1, dt * 8); // weich gleiten
      c.x = mem.x;
    }

    for (const c of cars) {
      const ad = Math.abs(c.dist);
      const beside = c.ghostOnly || confirmed.has(c);
      // rot = neben dir, orange = nah dran, sonst hell – je weiter weg, desto blasser
      let color = '#cfd8e6', alpha = 0.45 + 0.5 * Math.max(0, 1 - ad / view);
      if (beside || (ad < OVERLAP && Math.abs(c.x) < 0.5)) { color = '#ff4d4d'; alpha = 1; }
      else if (c.gap != null ? c.gap < 7 : ad < 12) { color = '#ffb02e'; alpha = 1; }
      // vom Spotter gemeldet = überlappt sicher → auch so zeichnen, selbst wenn die Streckenposition etwas abweicht
      const off = beside && ad > carLen * 0.8 ? Math.sign(c.dist) * len * 0.8 : pos(c);
      drawCar(c.x, off, len, color, alpha, c.ghostOnly ? null : c.color);
    }

    // Eigenes Auto
    drawCar(0, 0, len, '#3ddc84', 1, null);

    // Lücke zum nächsten Auto davor / dahinter
    const ahead = r.cars.filter((c) => c.dist >= OVERLAP).sort((a, b) => a.dist - b.dist)[0];
    const behind = r.cars.filter((c) => c.dist <= -OVERLAP).sort((a, b) => b.dist - a.dist)[0];
    ctx.font = '700 13px Bahnschrift, Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    const gapOf = (c) => (c.gap != null ? c.gap : Math.abs(c.dist));
    if (ahead) ctx.fillText(gapOf(ahead).toFixed(1) + ' m', CX, 14);
    if (behind) ctx.fillText(gapOf(behind).toFixed(1) + ' m', CX, H - 6);
  });
</script>
</body>
</html>
